<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>House Price Predictor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="predictor">
        <div class="intro">
          <p class="eyebrow">Beginner ML project</p>
          <h1>House Price Predictor</h1>
          <p>
            Estimate a home's price from common property details. This demo uses
            a simple weighted formula so the logic is easy to understand.
          </p>
        </div>

        <form id="price-form" class="form-panel">
          <label>
            <span>Location</span>
            <select id="location" name="location">
              <option value="suburban">Suburban</option>
              <option value="city">City center</option>
              <option value="premium">Premium neighborhood</option>
              <option value="rural">Rural</option>
            </select>
          </label>

          <label>
            <span>Square feet</span>
            <input id="area" name="area" type="number" min="300" max="10000" value="1800" />
          </label>

          <label>
            <span>Bedrooms</span>
            <input id="bedrooms" name="bedrooms" type="number" min="1" max="10" value="3" />
          </label>

          <label>
            <span>Bathrooms</span>
            <input id="bathrooms" name="bathrooms" type="number" min="1" max="8" step="0.5" value="2" />
          </label>

          <label>
            <span>Home age</span>
            <input id="age" name="age" type="number" min="0" max="150" value="8" />
          </label>

          <label>
            <span>Parking spaces</span>
            <input id="parking" name="parking" type="number" min="0" max="6" value="1" />
          </label>

          <button type="submit">Predict price</button>
        </form>
      </section>

      <aside class="result-panel" aria-live="polite">
        <p class="panel-label">Estimated price</p>
        <strong id="price-output">$0</strong>
        <p id="confidence-output">Fill the details and run a prediction.</p>

        <div class="breakdown">
          <h2>What affected the price?</h2>
          <ul id="breakdown-list"></ul>
        </div>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
